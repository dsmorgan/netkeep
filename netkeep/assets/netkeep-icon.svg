<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- netkeep app icon (variant B, chosen 2026-10-22): a white lowercase "n" with three nodes,
       in front of a light-blue lowercase "k" facing left, on Apple's macOS icon grid
       (824 px rounded square centered on 1024, soft drop shadow). -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
