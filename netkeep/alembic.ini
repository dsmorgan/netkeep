# Alembic configuration. There is no sqlalchemy.url here on purpose: alembic/env.py
# asks netkeep.db.database_url(), which honors NETKEEP_DATABASE_URL and
# NETKEEP_DATA, so the migrations and the app always agree on the database.
# Prefer `netkeep db upgrade|current|revision` over the alembic command.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

# `netkeep db revision` output passes `make lint` without a manual pass.
[post_write_hooks]
hooks = ruff_fix, ruff_format

ruff_fix.type = exec
ruff_fix.executable = %(here)s/../.venv/bin/ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = exec
ruff_format.executable = %(here)s/../.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
