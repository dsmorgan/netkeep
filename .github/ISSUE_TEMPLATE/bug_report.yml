name: Bug report
description: Something does not work as the spec or docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Attach screenshots of what you saw, and make the **standard support bundle** (Settings, Support, or `netkeep support bundle`); see [Reporting a problem](https://github.com/dsmorgan/netkeep/blob/main/docs/guide/reporting-a-problem.md). The bundle replaces personal values with placeholders and holds no secrets, but skim its `logs/netkeep.log` before you attach it here, or send it privately and say so below.

        Never attach a **full** bundle here: it holds real names. Never paste cookies, OAuth tokens, or other people's names, emails, or phone numbers.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - LinkedIn extractor (sync, enrichment, browser attach)
        - CRM (contacts, triage, tags, lists, import, export)
        - Campaigns (templates, sequences, Gmail, LinkedIn messaging, replies)
        - LLM module
        - Web UI
        - CLI
        - Install / container / launchd
        - Docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: netkeep version or commit
      placeholder: "0.1.0 or git SHA"
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 15.1, Chrome 150 / Ubuntu 24.04 container"
  - type: textarea
    id: bundle
    attributes:
      label: Support bundle and screenshots
      description: Drag your screenshots and the standard bundle (netkeep-support-standard-....zip) here, or say that you sent the bundle privately, or why you can't make one (for example, the install fails).
      placeholder: Attach the .zip and screenshots by dragging them into this box.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Anything else from the logs
      description: Optional. The bundle already holds the last 7 days of logs, redacted.
      render: text
