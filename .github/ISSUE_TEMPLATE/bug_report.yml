name: Bug report
description: Something does not work as the spec or docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Attach the **standard support bundle** and screenshots of what you saw. Make the bundle on Settings, under Support, or with `netkeeper support bundle`; see [Reporting a problem](https://github.com/dsmorgan/netkeeper/blob/main/docs/guide/reporting-a-problem.md). The standard bundle holds no personal data and no secrets.

        Never attach a **full** bundle here: it holds real names. Never paste cookies, OAuth tokens, or other people's names, emails, or phone numbers.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - LinkedIn extractor (sync, enrichment, browser attach)
        - CRM (contacts, triage, tags, lists, import, export)
        - Campaigns (templates, sequences, Gmail, LinkedIn messaging, replies)
        - LLM module
        - Web UI
        - CLI
        - Install / container / launchd
        - Docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: netkeeper version or commit
      placeholder: "0.1.0 or git SHA"
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 15.1, Chrome 150 / Ubuntu 24.04 container"
  - type: textarea
    id: bundle
    attributes:
      label: Support bundle and screenshots
      description: Drag the standard bundle (netkeeper-support-standard-....zip) and your screenshots here.
      placeholder: Attach the .zip and screenshots by dragging them into this box.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Anything else from the logs
      description: Optional. The bundle already holds the last 7 days of logs, redacted.
      render: text
