# Publishes a release (ADR 0011 rules 1, 2 and 4; #683). A `vX.Y.Z` tag push builds the
# wheel and sdist, exports the constraints file from uv.lock, installs the wheel on an
# Intel and an Apple-silicon Mac, then publishes to PyPI with trusted publishing from the
# protected `release` environment and attaches the files, with checksums, to an
# immutable GitHub release. No PyPI token is stored anywhere: PyPI trusts this workflow
# file, in this repository, running in that environment.
#
# Run it by hand (Actions > Release > Run workflow) for a dry run: every step up to the
# publish, which it skips. The maintainer's setup and steps are in CONTRIBUTING.md,
# "Releasing".
#
# Every action is pinned to a full commit SHA (the version is the comment beside it), so
# a moved tag can't change what runs with publishing rights. Dependabot updates the pins.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Each job asks for what it needs; nothing has write access by default.
permissions: {}

# One release at a time, and a newer tag never cancels one halfway through publishing.
# Dry runs queue in their own group, so a manual run can't displace a pending tag run.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the tag's commit can be checked against main.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # A release builds from nothing cached: a poisoned cache can't reach it.
          enable-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: uv python install

      # A tag push: the tag must be vX.Y.Z for the version pyproject.toml and
      # netkeep/__init__.py both carry, on a commit main already has, with no GitHub
      # release yet (releases are immutable; this never replaces one). A dry run
      # checks only that the two files agree.
      - name: Check the tag against the package version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = push ]; then
            version="$(uv run --no-project scripts/check_release_version.py --tag "$TAG")"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "error: $TAG points at $GITHUB_SHA, which is not on main"; exit 1
            fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "error: a GitHub release named $TAG already exists; releases are never replaced"
              exit 1
            fi
          else
            version="$(uv run --no-project scripts/check_release_version.py)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version ($EVENT)" >> "$GITHUB_STEP_SUMMARY"

      # The same steps as ci.yml's "Wheel ships the UI" job.
      - run: make build-ui
      - run: uv build
      - run: scripts/smoke-wheel.sh

      # The one dependency set CI tested (ADR 0011 rule 1): runtime dependencies only,
      # each with its environment marker, so the cryptography pair (rule 2) comes out as
      # one pin per side. No hashes: `uv tool install -c` doesn't check them
      # (docs/design/install-options.md, option A).
      - name: Export the constraints file
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --quiet -o dist/constraints.txt
          grep -E "^cryptography==48\..*platform_machine == 'x86_64' and sys_platform == 'darwin'" dist/constraints.txt
          grep -E "^cryptography==(49|[5-9][0-9])\..*platform_machine != 'x86_64' or sys_platform != 'darwin'" dist/constraints.txt

      # The one-line installer (ADR 0011 rule 5; #686), with this release's version in
      # place of its placeholder, so each release's copy installs that release only.
      - name: Stamp the version into the installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed "s/^    netkeep_version='@NETKEEP_VERSION@'\$/    netkeep_version='$VERSION'/" scripts/install.sh > dist/install.sh
          grep -qx "    netkeep_version='$VERSION'" dist/install.sh
          if grep -q '@NETKEEP_VERSION@' dist/install.sh; then echo "error: install.sh still has its placeholder"; exit 1; fi
          sh -n dist/install.sh

      - name: Check the file names and write SHA256SUMS
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: dist
        run: |
          test -f "netkeep-$VERSION-py3-none-any.whl"
          test -f "netkeep-$VERSION.tar.gz"
          test "$(ls | wc -l)" -eq 4
          sha256sum "netkeep-$VERSION-py3-none-any.whl" "netkeep-$VERSION.tar.gz" constraints.txt install.sh > SHA256SUMS
          cat SHA256SUMS
          { echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Two artifacts, because the PyPI upload takes everything in its directory and
      # must see only the wheel and the sdist.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/constraints.txt
            dist/install.sh
            dist/SHA256SUMS
          if-no-files-found: error

  # The wheel installed the way a user installs it, on both Mac architectures (ADR 0011
  # rule 2): Intel gets cryptography 48.x from wheels, Apple silicon the current one.
  smoke-install:
    name: Install on ${{ matrix.arch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Intel
            runner: macos-15-intel
          - arch: Apple silicon
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release
      - run: shasum -a 256 -c SHA256SUMS
        working-directory: release
      - run: scripts/smoke-tool-install.sh release
      # The stamped installer parses and plans its steps on this Mac. A dry run downloads
      # and installs nothing.
      - run: sh release/install.sh --dry-run

  publish:
    name: Publish to PyPI
    needs: [build, smoke-install]
    # Only a tag push publishes; a dry run stops before this job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The protected environment: a required reviewer approves before this job starts,
    # and PyPI's trusted publisher names this environment, so no other job can publish.
    environment:
      name: release
      url: https://pypi.org/project/netkeep/${{ needs.build.outputs.version }}/
    permissions:
      # The OIDC token PyPI exchanges for a short-lived upload token. Only this job has it.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets
      # The files that upload are the ones the build job checksummed and the Macs installed.
      - name: Verify the checksums
        working-directory: dist
        run: grep -E '\.(whl|tar\.gz)$' ../assets/SHA256SUMS | sha256sum -c -
      # Trusted publishing (no credential among the inputs) with PEP 740 attestations. PyPI
      # refuses a file name it already has, so a version is never replaced.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub release
    needs: [build, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release
      - run: sha256sum -c SHA256SUMS
        working-directory: release
      # A draft first, then every file, then publish: with immutable releases turned on,
      # a published release's files can't change, so they all go up before it's public.
      # Nothing overwrites a file, and an existing release (even a draft) stops the job.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "error: a GitHub release named $TAG already exists; releases are never replaced"
            exit 1
          fi
          {
            echo "Install on macOS with the one-line installer:"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh | sh"
            echo '```'
            echo
            echo "Or install with uv yourself, using this release's constraints file:"
            echo
            echo '```sh'
            echo "curl -fsSLo constraints.txt https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/constraints.txt"
            echo "uv tool install --python 3.12 --managed-python -c constraints.txt netkeep==$VERSION"
            echo '```'
            echo
            echo "SHA-256 checksums (also in \`SHA256SUMS\`):"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "netkeep $VERSION" --notes-file notes.md \
            "netkeep-$VERSION-py3-none-any.whl" "netkeep-$VERSION.tar.gz" constraints.txt install.sh SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
