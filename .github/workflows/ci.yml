# The checks that gate every pull request and every push to main. Each job runs
# the same commands a contributor runs locally (make lint|typecheck|test, the
# frontend scripts, make gen-client), so a green local run predicts a green CI run.
name: CI

on:
  push:
    branches: [main]
  # A draft runs nothing (see `changes`); marking it ready for review starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same branch cancels the run it supersedes. head_ref is the PR's
# branch; a push to main falls back to the ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What the change touches, so frontend or docs work does not wait on the Python
  # suite and backend work does not wait on the frontend. A job skipped here reports
  # "skipped", which a required check accepts; the `python` job below reports for
  # the three Python jobs. A push to main, and any change to this workflow, runs all.
  changes:
    name: Changed areas
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.areas.outputs.python }}
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$files"
          python=false
          frontend=false
          while IFS= read -r file; do
            case "$file" in
              "") ;;
              .github/*) python=true; frontend=true ;;
              frontend/*) frontend=true ;;
              docs/* | changelog.d/* | *.md) ;;
              *) python=true ;;
            esac
          done <<EOF
          $files
          EOF
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "python: $python, frontend: $frontend" >> "$GITHUB_STEP_SUMMARY"

  # Lint, typecheck and tests are separate jobs so they run side by side, and a lint
  # failure shows without waiting on the suite (#210). Each installs from the uv cache.
  lint:
    name: Python lint (ruff)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag past v7, so this is the exact release;
      # Dependabot keeps it current.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      # With no argument, uv installs the interpreter pinned in .python-version.
      - run: uv python install
      - run: uv sync --all-extras
      - run: make lint

  typecheck:
    name: Python typecheck (mypy)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --all-extras
      - run: make typecheck

  test:
    name: Python tests (pytest)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # tests/test_migrations.py runs the migration diff tests on SQLite always and
      # on PostgreSQL when NETKEEP_TEST_DATABASE_URL is set, so a SQLite-only
      # construct fails here instead of on a hosted install.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netkeep
          POSTGRES_PASSWORD: netkeep
          POSTGRES_DB: netkeep_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netkeep -d netkeep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NETKEEP_TEST_DATABASE_URL: postgresql+psycopg://netkeep:netkeep@localhost:5432/netkeep_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --all-extras
      # Across every core the runner has (pytest-xdist); `make test-serial` is the
      # one-process fallback. The slowest twenty are printed so the headroom under
      # tests/time_limit.py's limit shows on every run (#220). A runner is slower than
      # a laptop, so every scaled() budget there is doubled (#472).
      - run: make test
        env:
          PYTEST_ADDOPTS: --durations=20
          NETKEEP_TEST_TIME_SCALE: "2"

  # The name the single Python job had, kept so a branch-protection rule that
  # requires it still finds it: green when all three jobs above passed, or when the
  # change touched no Python and they were skipped on purpose. Skipped on a draft.
  python:
    name: Python (ruff, mypy, pytest)
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [changes, lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Python job passed, or none was needed
        env:
          CHANGES: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.python }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes: $CHANGES (python: $NEEDED), lint: $LINT, typecheck: $TYPECHECK, test: $TEST"
          test "$CHANGES" = success
          if [ "$NEEDED" = true ]; then
            test "$LINT" = success && test "$TYPECHECK" = success && test "$TEST" = success
          else
            test "$LINT" = skipped && test "$TYPECHECK" = skipped && test "$TEST" = skipped
          fi

  frontend:
    name: Frontend (eslint, tsc, vitest, build, prettier)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version from the packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check

  # The wheel must carry the built UI (#596): build the UI, build the wheel, install it
  # in a clean venv and fetch / from a running `serve` (scripts/smoke-wheel.sh).
  wheel:
    name: Wheel ships the UI
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv python install
      - run: make build-ui
      - run: uv build
      - run: scripts/smoke-wheel.sh
      # The same export the release attaches (release.yml), for the install jobs below.
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project --quiet -o dist/constraints.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: |
            dist/*.whl
            dist/constraints.txt
          if-no-files-found: error
          retention-days: 3

  # The built wheel installed the way a user installs it (ADR 0011 rules 1 and 2): a uv
  # tool with uv's own Python 3.12 and the constraints file, on an Intel and an Apple-
  # silicon Mac, then `netkeep version`, `config show` and `db upgrade` on scratch data
  # (scripts/smoke-tool-install.sh). Intel is the one that needs cryptography 48.x.
  # It also builds the launcher app (#754) into the scratch HOME and checks it with
  # plutil -lint, sh -n and xattr: no quarantine attribute, so Gatekeeper doesn't apply.
  mac-install:
    name: Install on ${{ matrix.arch }}
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Intel
            runner: macos-15-intel
          - arch: Apple silicon
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: wheel
      - run: scripts/smoke-tool-install.sh wheel

  # The client is generated from the backend's schema, so either side can drift it.
  client-drift:
    name: Generated client is current
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag past v7, so this is the exact release;
      # Dependabot keeps it current.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv python install
      - run: uv sync --all-extras
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: make gen-client
      - name: Compare the committed client with the regenerated one
        run: |
          if git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts; then
            echo "The committed API client matches the backend's OpenAPI schema." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## The generated API client is out of date"
              echo
              echo "The backend's OpenAPI schema no longer matches \`frontend/openapi.json\` and \`frontend/src/api/schema.d.ts\`."
              echo "Run \`make gen-client\` at the repository root and commit both files."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
