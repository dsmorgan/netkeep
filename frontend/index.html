<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // The theme switch's saved choice, before the first paint (#666; src/lib/theme.ts).
      try {
        // The name before the rename (#661) too, until main.tsx moves it.
        const theme =
          localStorage.getItem('netkeep.theme') ?? localStorage.getItem('netkeeper.theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="color-scheme"]').content = theme
        }
      } catch {
        // Storage is blocked: Auto.
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>netkeep</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
